name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-arm64:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Build
        run: cargo build --release

      - name: Smoke test
        run: .\target\release\snaptop.exe --version

      - uses: actions/upload-artifact@v4
        with:
          name: snaptop-arm64
          path: target/release/snaptop.exe
          if-no-files-found: error

  build-linux-arm64:
    runs-on: ubuntu-24.04-arm
    env:
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-unknown-linux-musl

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Build
        run: cargo build --release --target aarch64-unknown-linux-musl

      - name: Smoke test
        run: ./target/aarch64-unknown-linux-musl/release/snaptop --version

      - uses: actions/upload-artifact@v4
        with:
          name: snaptop-linux-arm64
          path: target/aarch64-unknown-linux-musl/release/snaptop
          if-no-files-found: error

  publish:
    needs: [build-arm64, build-linux-arm64]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Package
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Tag must be vX.Y.Z, got '$env:GITHUB_REF_NAME'"
          }
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches.Groups[1].Value
          if ($cargo -ne $version) {
            throw "Tag says $version but Cargo.toml says $cargo"
          }
          $zip = "snaptop-v$version-arm64.zip"
          Copy-Item "dist/snaptop-arm64/snaptop.exe" "snaptop.exe"
          Compress-Archive -Path "snaptop.exe", "LICENSE" -DestinationPath $zip
          $hash = (Get-FileHash -Path $zip -Algorithm SHA256).Hash

          $tar = "snaptop-linux-arm64.tar.gz"
          New-Item -ItemType Directory -Path staging -Force | Out-Null
          Copy-Item "dist/snaptop-linux-arm64/snaptop" "staging/snaptop"
          Copy-Item "LICENSE" "staging/LICENSE"
          tar -czf $tar -C staging snaptop LICENSE

          "VERSION=$version" >> $env:GITHUB_ENV
          "ZIP=$zip" >> $env:GITHUB_ENV
          "TAR=$tar" >> $env:GITHUB_ENV
          "SHA256=$hash" >> $env:GITHUB_ENV

      - name: Generate winget manifests
        shell: pwsh
        run: ./packaging/winget/New-WingetManifests.ps1 -Version $env:VERSION -Sha256 $env:SHA256 -OutDir packaging/winget/out

      - name: Validate winget manifests
        run: winget validate --manifest packaging/winget/out

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ZIP }}
            ${{ env.TAR }}
            packaging/winget/out/*.yaml
          generate_release_notes: true
