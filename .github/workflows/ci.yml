name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Build
        run: cargo build --release

  arm64:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Build
        run: cargo build --release

  linux-arm64:
    runs-on: ubuntu-24.04-arm
    env:
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-unknown-linux-musl
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Build
        run: cargo build --release --target aarch64-unknown-linux-musl
      - name: Smoke test
        run: ./target/aarch64-unknown-linux-musl/release/snaptop --version

  manifests:
    runs-on: windows-latest
    strategy:
      matrix:
        architecture: [arm64, x64]
    steps:
      - uses: actions/checkout@v5
      - name: Generate
        shell: pwsh
        run: ./packaging/winget/New-WingetManifests.ps1 -Version 0.1.0 -Architecture '${{ matrix.architecture }}' -Sha256 ('0' * 64) -OutDir "$env:RUNNER_TEMP\winget"
      - name: Validate
        run: winget validate --manifest "$env:RUNNER_TEMP\winget"
