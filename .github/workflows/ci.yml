name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Build
        run: cargo build --release

  arm64:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test
      - name: Build
        run: cargo build --release

  manifests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Generate
        shell: pwsh
        run: ./packaging/winget/New-WingetManifests.ps1 -Version 0.1.0 -Sha256 ('0' * 64) -OutDir "$env:RUNNER_TEMP\winget"
      - name: Validate
        run: winget validate --manifest "$env:RUNNER_TEMP\winget"
