<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: transparent; }
  .card {
    width: 1100px; height: 260px; box-sizing: border-box;
    border-radius: 44px; border: 2px solid #232A37;
    background: #0A0C11;
    display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
    font-family: "Cascadia Mono", "Cascadia Code", Consolas, monospace;
  }
  .card::before {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(620px 300px at 22% 0%, rgba(72,220,198,.16), transparent 70%);
  }
  .mark { width: 150px; height: 150px; position: relative; }
  .text { margin-left: 38px; position: relative; display: flex; flex-direction: column; justify-content: center; }
  .word {
    font-size: 98px; font-weight: 700; letter-spacing: -4px;
    line-height: 1; color: #D8E0EE;
  }
  .s { color: #48DCC6; }
  .tag {
    margin-top: 15px; font-size: 19px; letter-spacing: 6px;
    color: #6F7C91; text-transform: uppercase;
  }
</style>
</head>
<body>
  <div class="card">
    <img class="mark" src="logo-mark.svg" alt="">
    <div class="text">
      <div class="word"><span class="s">s</span>naptop</div>
      <div class="tag">CPU · GPU · NPU · power</div>
    </div>
  </div>
</body>
</html>
